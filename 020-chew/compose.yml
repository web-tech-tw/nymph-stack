version: "3.5"
services:
  inte:
    image: ghcr.io/web-tech-tw/chew:main
    networks:
      - nymph-stack
    labels:
      - "traefik.enable=true"
      - "traefik.group=nymph-stack"
      - "traefik.http.routers.chew-inte.rule=PathPrefix(`/chew`)"
      - "traefik.http.services.chew-inte.loadbalancer.server.port=80"
      - "traefik.http.services.chew-inte.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.chew-inte.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.routers.chew-inte.middlewares=chew-inte-strip-prefix"
      - "traefik.http.middlewares.chew-inte-strip-prefix.stripprefix.prefixes=/chew"
    restart: unless-stopped

  recv:
    image: ghcr.io/web-tech-tw/chew.recv:main
    container_name: chew-recv
    environment:
      APP_CONFIGURED: "1"
    env_file:
      - config.env
    networks:
      - sara
      - nymph-stack
    volumes:
      - ../010-sara/keypair_public.pem:/workplace/keypair_public.pem:ro
    labels:
      - "traefik.enable=true"
      - "traefik.group=nymph-stack"
      - "traefik.http.routers.chew-recv.rule=PathPrefix(`/recv/chew`)"
      - "traefik.http.services.chew-recv.loadbalancer.server.port=3000"
      - "traefik.http.services.chew-recv.loadbalancer.healthcheck.path=/robots.txt"
      - "traefik.http.services.chew-recv.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.routers.chew-recv.middlewares=chew-recv-strip-prefix"
      - "traefik.http.middlewares.chew-recv-strip-prefix.stripprefix.prefixes=/recv/chew"
    restart: unless-stopped

networks:
  sara:
    external:
      name: sara
  nymph-stack:
    external:
      name: nymph-stack
