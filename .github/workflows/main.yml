name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Webhook 📲
        env:
          WEBHOOK_URL: ${{ vars.NYMPH_WEBHOOK_URL_STACK_UP }}
          WEBHOOK_SECRET: ${{ secrets._WEBHOOK_SECRET_STACK_UP }}
          WEBHOOK_JSON: ${{ toJSON(secrets) }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "X-Nymph-Stack-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$WEBHOOK_JSON" \
            "$WEBHOOK_URL"
