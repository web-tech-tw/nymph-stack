name: Main workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Webhook 📲
        env:
          WEBHOOK_URL: ${{ vars.NYMPH_WEBHOOK_URL_STACK_UP }}
          WEBHOOK_SECRET: ${{ secrets._WEBHOOK_SECRET_STACK_UP }}
        run: |
          ENV_JSON='{"secret":"'$WEBHOOK_SECRET'","env":'$(echo '${{ toJSON(secrets) }}')'}'
          curl --fail-with-body -X POST -H "Content-Type: application/json" -d "$ENV_JSON" "$WEBHOOK_URL"
