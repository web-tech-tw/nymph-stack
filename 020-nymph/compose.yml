version: "3.5"
services:
  nymph:
    image: ghcr.io/web-tech-tw/nymph:main
    container_name: nymph
    environment:
      APP_CONFIGURED: "1"
    env_file:
      - config.env
    networks:
      - nymph-stack
    volumes:
      - ./prompts.json:/workplace/prompts.json:ro
      - ./relay.json:/workplace/relay.json:ro
      - ./roles.json:/workplace/roles.json:ro
      - ./data:/workplace/data:rw
    labels:
      - "traefik.enable=true"
      - "traefik.group=nymph-stack"
      - "traefik.http.routers.nymph.rule=PathPrefix(`/nymph`)"
      - "traefik.http.services.nymph.loadbalancer.server.port=3000"
      - "traefik.http.services.nymph.loadbalancer.healthcheck.path=/robots.txt"
      - "traefik.http.services.nymph.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.routers.nymph.middlewares=nymph-strip-prefix"
      - "traefik.http.middlewares.nymph-strip-prefix.stripprefix.prefixes=/nymph"
    restart: always
  redis:
    image: redis:latest
    restart: always

networks:
  nymph-stack:
    external:
      name: nymph-stack
