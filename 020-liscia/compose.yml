version: "3.5"
services:
  liscia:
    image: ghcr.io/web-tech-tw/liscia:main
    environment:
      APP_CONFIGURED: "1"
    env_file:
      - config.env
    networks:
      - nymph-stack
    volumes:
      - ./translation.toml:/app/translation.toml:ro
    restart: unless-stopped

networks:
  nymph-stack:
    external:
      name: nymph-stack
