version: "3.5"
services:
  web:
    image: ghcr.io/web-tech-tw/openchat:main
    environment:
      NUXT_APP_BASE_URL: "/openchat"
    networks:
      - nymph-stack
    labels:
      - "traefik.enable=true"
      - "traefik.group=nymph-stack"
      - "traefik.http.routers.openchat.rule=PathPrefix(`/openchat`)"
      - "traefik.http.services.openchat.loadbalancer.server.port=3000"
      - "traefik.http.services.openchat.loadbalancer.healthcheck.path=/openchat/api/healthz"
      - "traefik.http.services.openchat.loadbalancer.healthcheck.interval=30s"
    restart: unless-stopped

  recv:
    image: ghcr.io/web-tech-tw/openchat-join:main
    container_name: openchat-recv
    environment:
      APP_CONFIGURED: "1"
    env_file:
      - config.env
    networks:
      - sara
      - nymph-stack
    volumes:
      - ../010-sara/keypair_public.pem:/workplace/keypair_public.pem:ro
      - ./secret.key:/workplace/secret.key:ro
    labels:
      - "traefik.enable=true"
      - "traefik.group=nymph-stack"
      - "traefik.http.routers.openchat-recv.rule=PathPrefix(`/recv/openchat`)"
      - "traefik.http.services.openchat-recv.loadbalancer.server.port=3000"
      - "traefik.http.services.openchat-recv.loadbalancer.healthcheck.path=/robots.txt"
      - "traefik.http.services.openchat-recv.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.routers.openchat-recv.middlewares=openchat-recv-strip-prefix"
      - "traefik.http.middlewares.openchat-recv-strip-prefix.stripprefix.prefixes=/recv/openchat"
    restart: unless-stopped

networks:
  sara:
    external:
      name: sara
  nymph-stack:
    external:
      name: nymph-stack
