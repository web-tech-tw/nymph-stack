version: "3.5"
services:
  traefik:
    image: traefik:v3
    networks:
      - nymph-stack
    ports:
      - 127.0.0.1:13005:13005
      - 127.0.0.1:13006:13006
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped

networks:
  nymph-stack:
    name: nymph-stack
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1450"
